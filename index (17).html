label{display:block;margin:10px 0;font-size:13px;font-weight:700;color:var(--sub)}
input,select,textarea{width:100%;min-height:48px;padding:11px 12px;font-size:16px;border:1.5px solid #B9C7D5;border-radius:12px;background:#fff;color:var(--ink);margin-top:4px}
input[type=checkbox],input[type=radio],input[type=file]{width:auto;min-height:0}
textarea{min-height:90px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}

.tag{background:var(--chip);color:var(--brand);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}

.bar>div{background:#E4EBF2;border-radius:6px;height:12px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:6px}
.bar span:last-child{font-weight:800;font-variant-numeric:tabular-nums}
.tr{display:flex;align-items:flex-end;gap:4px;height:120px;padding:10px 8px 0;background:#F6F9FC;border-radius:12px}

.tr div:last-child{background:var(--accent)}
.tl{font-size:10px;color:var(--sub)}

.sheet{border-radius:22px 22px 0 0}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:3px;background:#C7D3DF;margin:0 auto 12px}
.sheet h3{font-size:18px;font-weight:800;margin:0 0 12px;color:var(--ink)}
.sheet .bt{padding-bottom:calc(4px + env(safe-area-inset-bottom))}
#toast{background:var(--ink);color:#fff;border-radius:14px;padding:11px 18px;font-weight:600;box-shadow:0 6px 18px rgba(19,41,61,.3)}
#fab{background:var(--accent);height:54px;border-radius:27px;padding:0 22px;font-size:16px;font-weight:800;box-shadow:0 6px 16px rgba(194,85,8,.4)}
.st button{width:44px;height:44px}
.st input{width:60px;min-height:44px;margin:0}
.rt td:not(:first-child),.rt th:not(:first-child){white-space:nowrap}

.ux-hero{background:var(--brand);color:#fff;border-radius:20px;padding:16px 18px 14px;margin:0 0 12px}
.ux-hero small{display:block;color:rgba(255,255,255,.85);font-size:13px;font-weight:600}
.ux-big{display:block;font-size:36px;line-height:1.1;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;margin:4px 0 12px}

.ux-two b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}

.ux-sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px}
.ux-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.ux-h b{font-size:15px;font-weight:800}
.ux-pill{min-width:26px;text-align:center;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:800;background:#FDE3E0;color:var(--bad)}

.ux-ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.ux-ph h2{margin:0}
.ux-ghost{min-height:40px;padding:8px 14px;border:1.5px solid #B9C7D5;border-radius:999px;background:#fff;color:var(--brand);font-size:13.5px;font-weight:700;white-space:nowrap}
.ux-sum{font-size:13px;color:var(--sub);margin:-4px 0 10px}.ux-sum b{color:var(--ink)}
.ux-lab{font-size:12.5px;font-weight:800;color:var(--sub);margin:18px 4px 8px}
.ux-grp{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ux-item{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:11px 14px;background:#fff;border:0;border-bottom:1px solid #EDF1F5;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.ux-item:last-child{border-bottom:0}
.ux-ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--brand);display:flex;align-items:center;justify-content:center}
.ux-tx{flex:1;min-width:0}
.ux-tx b{display:block;font-size:15px;font-weight:700}
.ux-tx small{display:block;font-size:12.5px;color:var(--sub);margin-top:1px;word-break:break-word}
.ux-ch{color:#8FA2B5;font-size:22px;line-height:1}
.ux-item.go .ux-ic{background:#DFF2E5;color:var(--good)}
.ux-item.out .ux-ic{background:#FDE3E0;color:var(--bad)}
.ux-item.out b{color:var(--bad)}
.ux-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9AA9B8;margin-right:6px;vertical-align:1px}.ux-dot.on{background:var(--good)}
details.ux-info{margin:16px 2px 0}
details.ux-info p{margin:10px 2px 0}
@media(max-width:899px){
#lo{display:none!important}
main{padding:14px 14px 0}
nav{box-shadow:0 -4px 14px rgba(19,41,61,.07);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
nav button{border-top:0;border-radius:14px;padding:4px 0;min-height:56px;font-size:11.5px;font-weight:600;color:var(--sub);background:none}
nav button span{display:flex;align-items:center;justify-content:center;width:58px;height:30px;margin:0 auto 2px;border-radius:15px}
nav button svg{margin:0}
nav button.on{background:none;color:var(--brand);font-weight:800}
nav button.on span{background:#D6E6F6}
#fab{bottom:calc(78px + env(safe-area-inset-bottom))}
}
@media(min-width:900px){
.sheet::before{display:none}
.ux-home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.ux-new{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

const stMsg=(n,m)=>{const a=acc(n,m),mn=new Date(m+'-01T00:00').toLocaleDateString('en-IN',{month:'long'});
return `*AAVIN STORE*\nN. Basker | 9500368303\nSouth Street, Thirukovilur\nAccount Statement - ${mname(m)}\n\nHello ${n},\n\nInvoice No: ${invNo(n,m)}\n------------------------\nPrevious Balance: ${inr(a.prev)}\n${mn} Purchases: ${inr(a.buy)}\nTotal Due: ${inr(a.due)}\nPayment Received: ${inr(a.paid)}\n------------------------\n*${a.rem<0?'Advance Balance':'Remaining Balance'}: ${inr(Math.abs(a.rem))}*\nStatus: *${a.st}*\n\nThank you for shopping with Aavin Store.`};
/* file helpers */
function dlBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),6e4)}
async function putFile(b,name,share){const f=new File([b],name,{type:b.type});if(share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(x){if(x.name=='AbortError')return}}dlBlob(b,name);toast('Downloaded ✔ '+name)}
